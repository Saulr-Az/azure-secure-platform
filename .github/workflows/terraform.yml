name: Despliegeue de validacion y plan de Terraform

on:
  push:
   branches:
    - main 

  pull_request:

jobs:
  terraform:
  #Usa una maquina ubuntu para que haga las tareas de revision
    runs-on: ubuntu-latest

    steps:
    #Descarga los datos a la maquina
      - name: Checkout
        uses: actions/checkout@v4

    #Las tareas que realizara
      - name: Azure Login
        uses: azure/login@v2

        with:

          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

#Ejecuta las comprovaciones de Terraform y generara el plan
      - name: Terraform Init
#Le indicamos el directorio donde esta el terraform hay que ponerlo en cada paso
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Format
        working-directory: terraform/environments/dev
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        run: terraform plan